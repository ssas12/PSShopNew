
name: Build PSShop Today APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract new project
        run: |
          unzip -q PSShop_Today_Project-1.zip -d source
          test -f source/PSShop_Today_Project/app/build.gradle

      - name: Build new APK
        run: |
          cd source/PSShop_Today_Project
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PSShop-Today-APK
          path: source/PSShop_Today_Project/app/build/outputs/apk/debug/app-debug.apk
